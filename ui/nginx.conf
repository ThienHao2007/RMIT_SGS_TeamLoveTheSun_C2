server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
  }

  location ~ ^/(overview|policies|policy|audit|administrators|quorum|limits|data)(/|$) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
